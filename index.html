<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReadyText</title>
<meta name="description" content="ReadyText, an Android app that tells a shop's customers their order is ready. Published by Long Thuy Pty Ltd.">
<style>
  :root { --bg: #ffffff; --text: #1b1f24; --muted: #5b6470; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121417; --text: #e7eaee; --muted: #a3acb7; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
         background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif; }
  main { max-width: 480px; text-align: center; }
  svg { width: 88px; height: 88px; }
  h1 { margin: 12px 0 4px; font-size: 1.75rem; }
  p { margin: 4px 0; }
  .muted { color: var(--muted); font-size: .95rem; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 108 108" aria-hidden="true">
    <rect width="108" height="108" rx="24" fill="#1e88e5"/>
    <path fill="#ffffff" d="M34,32h40a6,6 0 0 1 6,6v26a6,6 0 0 1 -6,6h-24l-10,9v-9h-6a6,6 0 0 1 -6,-6v-26a6,6 0 0 1 6,-6z"/>
    <path fill="none" stroke="#1e88e5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M42,51l7,7l14,-14"/>
  </svg>
  <h1>ReadyText</h1>
  <p>Tell your customers their order is ready.</p>
  <p class="muted">An Android app by Long Thuy Pty Ltd.</p>
</main>
</body>
</html>
